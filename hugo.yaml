baseURL: "https://seekeren.github.io/"
languageCode: "zh-CN"
title: "seekeren blog"
theme: PaperMod

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true        # 面包屑导航
  ShowCodeCopyButtons: true    # 代码块复制按钮
  ShowToc: true                # 显示目录
  TocOpen: false               # 目录默认折叠
  comments: true

  # 首页简介模式配置
  homeInfoParams:
    Title: "Hi,我是seekeren,seeker-ren, 探索人"
    Content: "这里记录我的开发笔记和生活随想"

  # 社交链接（首页显示）
  socialIcons:
    - name: github
      url: "https://github.com/seekeren"

  # 封面图默认设置
  cover:
    hiddenInList: true        # 列表页隐藏封面
    hiddenInSingle: false     # 文章页显示封面

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: 文章
      url: /archives/
      weight: 10
    - name: 分类
      url: /categories/
      weight: 15
    - name: 搜索
      url: /search/
      weight: 20
    - name: 标签
      url: /tags/
      weight: 40
    - name: 关于
      url: /about/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true             # 允许 HTML 嵌入 Markdown
  highlight:
    style: dracula             # 代码高亮主题（推荐：dracula/monokai/nord/github）
    lineNos: true              # true 为显示
    lineNumbersInTable: true   # 行号显示在表格中（更易选中代码）
    noClasses: false           # 使用 CSS 类而不是内联样式
